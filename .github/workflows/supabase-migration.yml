name: Supabase Database Migration

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-migration.yml'
  workflow_dispatch:

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase Migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "Starting Supabase migration deployment..."
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is missing in GitHub Repository Secrets!"
            echo "Please add SUPABASE_DB_URL to Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          supabase db push --remote "$SUPABASE_DB_URL" --include-all
          echo "Migration completed successfully!"
