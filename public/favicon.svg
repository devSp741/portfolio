<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141d2b" />
      <stop offset="100%" stop-color="#090d15" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff675d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#364769" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#ff675d" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />
  
  <!-- Monogram S and P matching brand style -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="-2">
    <text x="14" y="43" fill="#f4f6fa">S</text>
    <text x="32" y="43" fill="#ff675d" filter="url(#glow)">P</text>
  </g>
</svg>

